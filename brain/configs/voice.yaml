stt:
  model_arch: 2
  model_name: "moonshine/tiny-streaming"
  language: "en"

tts:
  model: "kokoro-82m"
  voice: "af_heart"
  speed: 1.0
  device: "cpu"
  sample_rate: 24000
  language: "a"  # American English in Kokoro

interaction:
  mode: "half_duplex"
  auto_listen_after_greeting: true
  interruption_enabled: false
  greeting: "Welcome back, Nithish! It's good to have you here. I'm ready to chat, explore something interesting, and help you practise your communication skills. What's on your mind today?"

wake_word:
  enabled: true
  wake_phrases:
    - "hey jarvis"
    - "jarvis"
  silence_timeout_seconds: 3.0
  energy_threshold: 0.015
  partial_eval_interval: 0.5
  max_turn_seconds: 30.0

queue:
  max_size: 5
  overflow_policy: "notify"

playback:
  full_response_synthesis: true
  max_response_chars: 4000
